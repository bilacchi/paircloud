name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and build extension
        run: uv sync

      - name: Run Pytest
        run: uv run pytest tests/

  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Check formatting and linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

  release:
    name: Build and Release to PyPI
    needs: [test, lint]
    runs-on: ubuntu-latest
    # Only release when pushing a tag
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write  # MUST HAVE FOR PYPI TRUSTED PUBLISHING
      contents: write  # To create GH Release

    steps:
      - uses: actions/checkout@v4

      # For Rust extensions, Maturin Action handles building across architectures
      # and OSs (wheels + sdist) and publishing.
      - name: Build and Publish Wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
          sdist: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
